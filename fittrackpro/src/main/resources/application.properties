############################################################
# APPLICATION
############################################################

spring.application.name=fittrackpro
server.port=1234

############################################################
# MYSQL DATABASE
############################################################

spring.datasource.url=jdbc:mysql://localhost:3306/FitTrackProDatabase?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=nieldave360
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

############################################################
# JPA / HIBERNATE
############################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

############################################################
# CONNECTION POOL (Hikari)
############################################################

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

############################################################
# JWT
############################################################

app.jwt.secret=ZmluYWxfc2VjdXJlX3NlY3JldF9rZXlfZm9yX2ppdF90cmFja19wcm9fc2lnbmluZ18yMDI2

# 15 Minutes
app.jwt.access-token-expiration-ms=900000

# 7 Days
app.jwt.refresh-token-expiration-ms=604800000

############################################################
# CORS
############################################################

# Vite Development
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
############################################################
# SWAGGER
############################################################

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

############################################################
# JACKSON
############################################################

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

############################################################
# LOGGING
############################################################

logging.level.root=INFO
logging.level.com.nieldave.fittrackpro=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

############################################################
# ACTUATOR
############################################################

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

############################################################
# FILE UPLOAD (Future Features)
############################################################

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB